[project]
name = "reliability"
version = "0.1.0"
description = "Drive fleet reliability analytics on Backblaze hard-drive telemetry"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "duckdb",
    "scipy",
    "lifelines",
    "jax",
    "numpyro",
    "scikit-learn",
    "lightgbm",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reliability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
